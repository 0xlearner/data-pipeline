# Naheed Store Configuration
# HTML-based web scraping configuration for Naheed.pk

[site]
name = "Naheed Store"
base_url = "https://www.naheed.pk"
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

[scraping]
delay_between_requests_ms = 2000
max_pages_per_category = 5
max_retries = 3
timeout_seconds = 30
respect_robots_txt = true

[selectors]
# Product container selectors - need to find the parent containers that contain both name and price
product_selectors = [
    "li.item",
    ".item",
    "li[class*='item']",
    ".product-item-info",
    ".product-item",
    "div[class*='product']",
    ".product-card"
]

# Product name selectors - comprehensive list to find product names
name_selectors = [
    "h2",
    "a[title]",
    ".product-name",
    ".product-item-name",
    ".item-title",
    ".product-title",
    "h3",
    ".title",
    "strong",
    ".name",
    "[class*='name']",
    "[class*='title']"
]

# Price selectors (based on your sample: data-price-amount attribute)
price_selectors = [
    "[data-price-amount]",
    ".price",
    ".regular-price",
    ".final-price",
    ".cost",
    ".amount",
    "[class*='price']",
    ".product-price",
    "span[class*='rs']",
    "span",
    ".price-wrapper"
]

# Category selectors (based on your sample: span.base with data-ui-id)
category_selectors = [
    "span.base[data-ui-id='page-title-wrapper']",
    ".page-title",
    ".breadcrumb",
    "h1",
    ".category-title"
]

pagination_selectors = [
    "#am-page-count",
    ".pagination",
    ".pager",
    ".page-numbers"
]

