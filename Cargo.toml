[package]
name = "data-pipeline"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "pipeline-tools"
path = "src/bin/pipeline-tools.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
wreq = { version = "5", features = ["json"] }
wreq-util = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.5"
toml = "0.9.6"
rust-s3 = { version = "0.35", default-features = false, features = ["tokio-rustls-tls", "fail-on-err", "tags"] }
polars = { version = "0.51.0", features = ["json", "parquet", "lazy"] }
ndarray = "0.16.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
config = "0.15.16"
async-trait = "0.1"
futures = "0.3"
url = "2.5"
dotenv = "0.15"
clap = { version = "4.0", features = ["derive"] }
# HTML processing dependencies
scraper = "0.20"
smartcore = "0.3"
rand = "0.8"
